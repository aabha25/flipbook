<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Flipbook</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #222;
            font-family: Arial, sans-serif;
              touch-action: pan-y;
        }

        /* Main layout */
        .viewer {
            width: 100%;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 20px;
        }

        /* Flipbook */
        .flipbook {
            height: 100vh;
            width: min(100vw - 140px, calc(100vh * 3 / 4));

            aspect-ratio: 3 / 4;

            position: relative;
            overflow: hidden;

            background: white;
        }

        /* Pages */
        .page {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            object-fit: fill;

            background: white;

            transition:
                opacity 0.25s ease,
                transform 0.25s ease;
        }

        .page.hidden {
            display: none;
        }

        /* Side controls */
        .side-button {
            width: 45px;
            height: 70px;

            border: none;
            border-radius: 8px;

            background: rgba(255, 255, 255, 0.9);

            font-size: 28px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;
        }

        .side-button:hover {
            background: white;
        }

        .side-button:disabled {
            opacity: 0.3;
            cursor: default;
        }

        /* Page number */
        #pageNumber {
            position: fixed;

            top: 10px;
            left: 50%;

            transform: translateX(-50%);

            color: white;
            
            font-size: 14px;

            z-index: 100;
        }
        #pageCanvas {
    width: 100%;
    height: 100%;
    display: block;
}
        #pageCover{
            position: fixed;
              top: 0px;
               z-index: 15;
               
              
                height: 5vh;
                width: inherit;              
            /* box-sizing: border-box; */
                 background-color: rgba(0, 0, 0, 0.655); 
                 color:  rgba(0, 0, 0, 0); 

        }

        /* Mobile */
        @media (max-width: 600px) {

            .viewer {
                width: 100dvw;
        height: 100dvh;

        display: flex;
        align-items: center;
        justify-content: center;
                gap: 5px;
            }

            .flipbook {
    width: min(96vw, calc(94dvh * 210 / 297));
    aspect-ratio: 210 / 297;
    height: auto;
}

            .side-button {
    display: none;
}
        }
    </style>
</head>

<body>


    <div class="viewer">

        <button
            class="side-button"
            id="previousButton"
            onclick="previousPage()">
            ‹
        </button>

        <div class="flipbook" id="flipbook">
              <canvas id="pageCanvas"></canvas>
        </div>

        <button
            class="side-button"
            id="nextButton"
            onclick="nextPage()">
            ›
        </button>

    </div>


    <script>

        const pages = [
            "https://i.postimg.cc/KjDHscZx/page1better.jpg",
            "https://i.postimg.cc/76vtHJhw/page2better.jpg",
            "https://i.postimg.cc/P592yvmK/page3better.jpg",
            "https://i.postimg.cc/WbfnpqYS/Whats-App-Image-2026-08-14-at-10-01-44-AM.jpg"
        ];


        const flipbook =
            document.getElementById("flipbook");

        const pageNumber =
            document.getElementById("pageNumber");

        const previousButton =
            document.getElementById("previousButton");

        const nextButton =
            document.getElementById("nextButton");


        let currentPage = 0;
       
        const canvas =
    document.getElementById("pageCanvas");

const ctx =
    canvas.getContext("2d");

let currentImage = null;

       
       


        function loadPage(index) {

    const img = new Image();

    img.crossOrigin = "anonymous";

    img.src = pages[index];

    img.onload = () => {

        currentImage = img;

        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;

        drawPage();
    };
}function drawPage() {

    if (!currentImage) return;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.drawImage(
        currentImage,
        0,
        0,
        canvas.width,
        canvas.height
    );
}
function showPage(index) {

    if (
        index < 0 ||
        index >= pages.length
    ) {
        return;
    }

    currentPage = index;

    loadPage(currentPage);

    updateUI();
} function nextPage() {
    showPage(currentPage + 1);
}

function previousPage() {
    showPage(currentPage - 1);
}
 flipbook.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX;
});

flipbook.addEventListener("touchend", (e) => {
    currentX = e.changedTouches[0].clientX;

    const distance = currentX - startX;

    // Minimum distance required for a swipe
    const threshold = 50;

    if (distance < -threshold) {
        // Swipe left → next page
        nextPage();
    }
    else if (distance > threshold) {
        // Swipe right → previous page
        previousPage();
    }
});

loadPage(0);
updateUI();

    </script>

</body>
</html>
