<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Flipbook</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #222;
            font-family: Arial, sans-serif;
              touch-action: none;
              display: block;
        }

        /* Main layout */
        .viewer {
            width: 100%;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 20px;
        }

        /* Flipbook */
        .flipbook {
            height: 100vh;
            width: min(100vw - 140px, calc(100vh * 3 / 4));

            aspect-ratio: 3 / 4;

            position: relative;
            overflow: hidden;
           
    touch-action: none;
            background: white;
        }

        /* Pages */
        .page {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            object-fit: fill;

            background: white;

            transition:
                opacity 0.25s ease,
                transform 0.25s ease;
        }

        .page.hidden {
            display: none;
        }

        /* Side controls */
        .side-button {
            width: 45px;
            height: 70px;

            border: none;
            border-radius: 8px;

            background: rgba(255, 255, 255, 0.9);

            font-size: 28px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;
        }

        .side-button:hover {
            background: white;
        }

        .side-button:disabled {
            opacity: 0.3;
            cursor: default;
        }

        /* Page number */
        #pageNumber {
            position: fixed;

            top: 10px;
            left: 50%;

            transform: translateX(-50%);

            color: white;
            
            font-size: 14px;

            z-index: 100;
        }
        #pageCanvas {
    width: 100%;
    height: 100%;
    display: block;
}
        #pageCover{
            position: fixed;
              top: 0px;
               z-index: 15;
               
              
                height: 5vh;
                width: inherit;              
            /* box-sizing: border-box; */
                 background-color: rgba(0, 0, 0, 0.655); 
                 color:  rgba(0, 0, 0, 0); 

        }

        /* Mobile */
        @media (max-width: 600px) {

            .viewer {
                width: 100dvw;
        height: 100dvh;

        display: flex;
        align-items: center;
        justify-content: center;
                gap: 5px;
            }

            .flipbook {
    width: min(96vw, calc(94dvh * 210 / 297));
    aspect-ratio: 210 / 297;
    height: auto;
}

            .side-button {
    display: none;
}
        }
    </style>
</head>

<body>


    <div class="viewer">

        <button
            class="side-button"
            id="previousButton"
           >
            ‹
        </button>

        <div class="flipbook" id="flipbook">
              <canvas id="pageCanvas"></canvas>
        </div>

        <button
            class="side-button"
            id="nextButton"
            >
            ›
        </button>

    </div>



  <script src="zoom.js"></script>
    <script src="flipbook.js"></script>


</body>
</html>
